name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: '清理所有构建缓存后重新构建'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # 仅当 clean_cache=true 时需要

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      # ========== 条件性清理缓存 ==========
      - name: Clean all caches (manual trigger only)
        if: ${{ github.event.inputs.clean_cache == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const caches = await github.rest.actions.getActionsCacheList({ owner, repo });
            let deleted = 0;
            for (const cache of caches.data.actions_caches) {
              await github.rest.actions.deleteActionsCacheById({
                owner, repo, cache_id: cache.id
              });
              deleted++;
            }
            core.info(`✅ 已删除 ${deleted} 个远程缓存`);
        continue-on-error: true

      - name: Clean local build artifacts (manual trigger only)
        if: ${{ github.event.inputs.clean_cache == 'true' }}
        run: |
          echo "🧹 清理本地构建目录..."
          rm -rf .buildozer ~/.buildozer ~/.gradle/caches ~/.gradle/wrapper ~/.cache/pip
          echo "✅ 本地缓存已清理"

      # ========== 缓存恢复（清理后此步自然miss）==========
      - name: Cache Buildozer & Gradle
        id: cache-buildozer
        if: ${{ github.event.inputs.clean_cache != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ========== 构建 ==========
      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        id: find-apk
        run: |
          apk_file=$(find ${{ github.workspace }} -type f -name '*.apk' -print -quit)
          if [ -z "$apk_file" ]; then
            echo "::error::No APK file found!"
            exit 1
          fi
          echo "APK_PATH=$apk_file" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find-apk.outputs.APK_PATH }}
          retention-days: 7
